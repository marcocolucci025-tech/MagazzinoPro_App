rootProject.name = "MagazzinoPro"

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"]
    .execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

include(":app")

def reactNativeGradlePluginDir = new File(["node", "--print",
    "require.resolve('react-native-gradle-plugin/package.json')"]
    .execute(null, rootDir).text.trim()).getParentFile()

if (reactNativeGradlePluginDir && reactNativeGradlePluginDir.exists()) {
    includeBuild(reactNativeGradlePluginDir)
} else {
    println("⚠ RN Gradle plugin non trovato, continuo senza includeBuild.")
}
