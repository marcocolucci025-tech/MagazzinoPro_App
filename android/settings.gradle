rootProject.name = "MagazzinoPro"

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"]
    .execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

// Rimosse righe obsolete che causavano errori "path may not be null"
// apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"]
//     .execute(null, rootDir).text.trim(), "../native_modules.gradle");
// applyNativeModulesSettingsGradle(settings)

include(":app")

// Compatibilità React Native Gradle Plugin
def reactNativeGradlePluginDir = new File(["node", "--print",
    "require.resolve('react-native-gradle-plugin/package.json')"]
    .execute(null, rootDir).text.trim()).getParentFile()

if (reactNativeGradlePluginDir && reactNativeGradlePluginDir.exists()) {
    includeBuild(reactNativeGradlePluginDir)
} else {
    println("⚠️  Attenzione: React Native Gradle Plugin non trovato, ma non è critico.")
}
