buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = (findProperty('android.minSdkVersion') ?: 23) as int
        compileSdkVersion = (findProperty('android.compileSdkVersion') ?: 34) as int
        targetSdkVersion = (findProperty('android.targetSdkVersion') ?: 34) as int
        ndkVersion = findProperty('android.ndkVersion') ?: '25.1.8937393'
        kotlinVersion = '1.9.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // facoltativo se usi Firebase/Play Services - non crea conflitti
        classpath("com.google.gms:google-services:4.3.15")
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        // Repository di React Native (necessario perché alcune artifact vivono qui)
        maven { url("$rootDir/../node_modules/react-native/android") }
        // Repository di Expo (per unimodules e plugin)
        maven { url("$rootDir/../node_modules/expo/android/maven") }
        // Alcune lib di terze parti
        maven { url("https://www.jitpack.io") }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

/**
 * Workaround per mismatch metadati Kotlin (1.6 vs 1.9)
 * Evita il crash di compilazione su plugin RN meno recenti.
 */
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("kotlinOptions")) {
            project.kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
}
