buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = findProperty('android.minSdkVersion')?.toInteger() ?: 23
        compileSdkVersion = findProperty('android.compileSdkVersion')?.toInteger() ?: 34
        targetSdkVersion = findProperty('android.targetSdkVersion')?.toInteger() ?: 34
        ndkVersion = findProperty('android.ndkVersion') ?: '25.1.8937393'
        kotlinVersion = '1.8.22'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
